name: Publish site and wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'themes/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Validate OKF v0.2
        run: |
          GOBIN="$RUNNER_TEMP/bin" GOTOOLCHAIN=auto \
            go install github.com/okfcli/okf/cmd/okf@latest
          "$RUNNER_TEMP/bin/okf" validate docs/

  publish:
    name: Render and deploy
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Render wiki with okf-wiki
        id: render-wiki
        uses: abn/okf-wiki/action@main
        with:
          content: docs
          out: _site
          base: /google-antigravity-plugin-auto-permissions/wiki
          theme: themes/abn
          deploy: false
          brand: "auto-permissions."
          brand-sub: wiki
          title: Auto-Permissions Wiki
          sections: "architecture:Architecture,guides:Guides,skills:Skills,reference:Reference,benchmarks:Benchmarks"
          nav-links: "Landing=https://abn.github.io/google-antigravity-plugin-auto-permissions/,GitHub=https://github.com/${{ github.repository }}"

      - name: Copy landing page to site root
        run: |
          mkdir -p _site/google-antigravity-plugin-auto-permissions
          cp -r site/* _site/google-antigravity-plugin-auto-permissions/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/google-antigravity-plugin-auto-permissions

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
