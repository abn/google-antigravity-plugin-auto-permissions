[project]
name = "auto-permissions"
version = "0.7.0"
description = "Autonomous security authorization moderator and auto-permission classifier for Google Antigravity tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Arun Babu Neelicattu", email = "arun.neelicattu@gmail.com" }
]
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["hooks", "skills", "tests", ".contrib"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
]

[tool.ruff.lint.isort]
known-first-party = ["hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
